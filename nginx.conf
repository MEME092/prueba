# Configuración de Nginx para Tecnología para Gente Normal
# Ubicación en VPS: /etc/nginx/sites-available/tecnologiaparagentenormal.com

server {
    listen 80;
    server_name tecnologiaparagentenormal.com www.tecnologiaparagentenormal.com;

    # Redirección automática a HTTPS (después de instalar Certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tecnologiaparagentenormal.com www.tecnologiaparagentenormal.com;

    # Certificados SSL de Let's Encrypt (generados con certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/tecnologiaparagentenormal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tecnologiaparagentenormal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Encabezados de Seguridad y Core Web Vitals para Google AdSense
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Servir archivos estáticos directamente para máxima velocidad
    location /static/ {
        alias /var/www/tecnologia_gente_normal/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Archivo ads.txt fundamental para aprobación de AdSense
    location /ads.txt {
        alias /var/www/tecnologia_gente_normal/static/ads.txt;
        default_type text/plain;
    }

    # Sitemap y robots.txt para indexación de Googlebot
    location /robots.txt {
        alias /var/www/tecnologia_gente_normal/static/robots.txt;
    }

    location /sitemap.xml {
        alias /var/www/tecnologia_gente_normal/static/sitemap.xml;
    }

    # Proxy inverso a la aplicación FastAPI corriendo en Gunicorn/Uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
    }
}
