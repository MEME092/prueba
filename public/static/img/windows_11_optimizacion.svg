<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="win-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <filter id="shadow-win" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#win-bg)" />

  <g transform="translate(60, 45)" filter="url(#shadow-win)">
    <!-- Main Window Container -->
    <rect width="1080" height="585" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar Fluent Design -->
    <rect width="1080" height="44" rx="16" fill="#1e293b" />
    <path d="M0 26 h1080 v18 h-1080 z" fill="#1e293b" />
    <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">🪟 Windows Terminal (Administrador: Windows PowerShell &amp; services.msc)</text>
    <circle cx="1010" cy="22" r="5" fill="#64748b" />
    <rect x="1025" y="17" width="10" height="10" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="1046" y="26" font-family="sans-serif" font-size="13" fill="#64748b">✕</text>

    <!-- Main Workspace -->
    <g transform="translate(30, 65)">
      <!-- Left: PowerShell Terminal -->
      <g transform="translate(0, 0)">
        <rect width="580" height="450" rx="10" fill="#012456" stroke="#1d4ed8" stroke-width="1" />
        
        <g transform="translate(20, 25)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" line-height="1.5">
          <text y="15" fill="#ffffff">Windows PowerShell (Administrador)</text>
          <text y="32" fill="#93c5fd">Copyright (C) Microsoft Corporation. Todos los derechos reservados.</text>
          
          <text y="65" fill="#facc15">PS C:\Windows\system32> <tspan fill="#ffffff">Stop-Service "DiagTrack" -Force</tspan></text>
          <text y="85" fill="#4ade80">Estado: Servicio de Telemetría detenido exitosamente.</text>
          
          <text y="115" fill="#facc15">PS C:\Windows\system32> <tspan fill="#ffffff">Set-Service "DiagTrack" -StartupType Disabled</tspan></text>
          
          <text y="145" fill="#facc15">PS C:\Windows\system32> <tspan fill="#ffffff">Set-Service "dmwappushservice" -StartupType Disabled</tspan></text>
          
          <text y="180" fill="#facc15">PS C:\Windows\system32> <tspan fill="#ffffff">Get-AppxPackage *bingnews* | Remove-AppxPackage</tspan></text>
          <text y="200" fill="#4ade80">Paquete de noticias preinstalado eliminado.</text>

          <text y="235" fill="#facc15">PS C:\Windows\system32> <tspan fill="#ffffff">Get-AppxPackage *king.com* | Remove-AppxPackage</tspan></text>
          <text y="255" fill="#4ade80">Juegos promocionales de fábrica eliminados.</text>

          <text y="290" fill="#facc15">PS C:\Windows\system32> <tspan fill="#ffffff">Get-Process | Measure-Object</tspan></text>
          <text y="315" fill="#38bdf8">Procesos activos antes: <tspan fill="#f87171">184</tspan>  →  Procesos activos ahora: <tspan fill="#4ade80" font-weight="700">112</tspan></text>

          <text y="355" fill="#93c5fd"># Windows Update y funciones críticas preservadas al 100%</text>
          <text y="380" fill="#facc15">PS C:\Windows\system32> <tspan fill="#38bdf8" font-weight="700">_</tspan></text>
        </g>
      </g>

      <!-- Right: Performance Monitor Comparison -->
      <g transform="translate(605, 0)">
        <rect width="415" height="450" rx="10" fill="#111827" stroke="#374151" stroke-width="1" />
        
        <g transform="translate(20, 24)">
          <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#ffffff" font-weight="800">Administrador de Tareas (Rendimiento)</text>
          <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9ca3af">Laptop Lenovo IdeaPad 3 • Intel Core i3 8GB</text>

          <!-- Graph Mockup -->
          <g transform="translate(0, 55)">
            <rect width="375" height="110" rx="8" fill="#1f2937" />
            <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9ca3af">CONSUMO DE MEMORIA RAM EN REPOSO</text>
            
            <!-- Bars -->
            <text x="14" y="55" font-family="monospace" font-size="11" fill="#f87171">Antes: 3.9 GB (49% uso)</text>
            <rect x="14" y="62" width="345" height="8" rx="4" fill="#374151" />
            <rect x="14" y="62" width="170" height="8" rx="4" fill="#ef4444" />

            <text x="14" y="90" font-family="monospace" font-size="11" fill="#4ade80">Después: 2.3 GB (28% uso) • 1.6 GB liberados</text>
            <rect x="14" y="96" width="345" height="8" rx="4" fill="#374151" />
            <rect x="14" y="96" width="98" height="8" rx="4" fill="#10b981" />
          </g>

          <!-- System Details -->
          <g transform="translate(0, 185)">
            <rect width="375" height="145" rx="8" fill="#1e293b" />
            <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-weight="700">PARÁMETROS VERIFICADOS EN BARRANQUILLA:</text>
            
            <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">✓ SSD NVMe: SysMain deshabilitado (cero desgaste)</text>
            <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">✓ Arranque frío: Reducido de 28s a 11s</text>
            <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">✓ Temperatura promedio en reposo: -4.2 °C</text>
            <text x="14" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">✓ Windows Defender y parches de seguridad al día</text>
            <text x="14" y="132" font-family="monospace" font-size="10" fill="#a7f3d0">Auditado por Andrés • Universidad de la Costa (CUC)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom Attribution Bar -->
    <rect x="0" y="535" width="1080" height="50" rx="16" fill="#0b132b" />
    <path d="M0 535 h1080 v20 h-1080 z" fill="#0b132b" />
    <text x="24" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">📸 <tspan fill="#38bdf8" font-weight="700">Captura original de Windows 11</tspan> • Capturado en hardware físico real en laboratorio • Sin copyright de terceros</text>
    <text x="910" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981" font-weight="700">© 100% Autóctona</text>
  </g>
</svg>
