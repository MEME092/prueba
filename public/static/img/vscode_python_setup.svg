<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-grad-vscode-python-setup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <filter id="shadow-vscode-python-setup" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg-grad-vscode-python-setup)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Application / Browser Window -->
  <g transform="translate(80, 50)" filter="url(#shadow-vscode-python-setup)">
    <!-- Window Outer -->
    <rect width="1040" height="575" rx="16" fill="#ffffff" />
    <rect width="1040" height="48" rx="16" fill="#f8fafc" />
    <path d="M0 32 h1040 v16 h-1040 z" fill="#f8fafc" />
    <line x1="0" y1="48" x2="1040" y2="48" stroke="#e2e8f0" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />

    <!-- Window Title / URL -->
    <rect x="110" y="10" width="820" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="126" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#60a5fa" font-weight="600">vscode://settings.json</text>

    <!-- Header bar inside window -->
    <g transform="translate(40, 75)">
      <rect width="960" height="58" rx="8" fill="#172554" />
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#ffffff" font-weight="800">Visual Studio Code Definitivo para Python: Ruff, Mypy y Virtualenvs</text>
      <rect x="760" y="14" width="180" height="30" rx="15" fill="#ffffff" opacity="0.18" />
      <text x="850" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">Ruff Linter + Pyright + Black</text>
    </g>

    <!-- Content Card -->
    <g transform="translate(40, 150)">
      <rect width="960" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Top Bar of Content Card -->
      <rect width="960" height="42" rx="12" fill="#ffffff" />
      <path d="M0 26 h960 v16 h-960 z" fill="#ffffff" />
      <line x1="0" y1="42" x2="960" y2="42" stroke="#e2e8f0" stroke-width="1" />
      <text x="24" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0f172a" font-weight="700">VS Code Workspace Configuration &amp; Settings.json</text>

      <!-- Subtitle badge -->
      <rect x="740" y="10" width="200" height="22" rx="6" fill="#60a5fa" opacity="0.15" />
      <text x="840" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#60a5fa" font-weight="700" text-anchor="middle">Laboratorio CUC Verificado</text>

      <!-- Checklist / Data Rows -->
      <g transform="translate(30, 65)">
        
        <g transform="translate(0, 0)">
          <rect width="900" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
          <circle cx="25" cy="25" r="10" fill="#60a5fa" opacity="0.2" />
          <circle cx="25" cy="25" r="4" fill="#60a5fa" />
          <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569" font-weight="600">Linter ultrarrápido:</text>
          <text x="880" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">Ruff (100x más rápido que flake8 y pylint)</text>
        </g>
        

        <g transform="translate(0, 62)">
          <rect width="900" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
          <circle cx="25" cy="25" r="10" fill="#60a5fa" opacity="0.2" />
          <circle cx="25" cy="25" r="4" fill="#60a5fa" />
          <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569" font-weight="600">Comprobación de tipos:</text>
          <text x="880" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">Pyright / Mypy para código tipado estricto</text>
        </g>
        

        <g transform="translate(0, 124)">
          <rect width="900" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
          <circle cx="25" cy="25" r="10" fill="#60a5fa" opacity="0.2" />
          <circle cx="25" cy="25" r="4" fill="#60a5fa" />
          <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569" font-weight="600">Gestión de entornos:</text>
          <text x="880" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">python -m venv .venv con activación automática</text>
        </g>
        

        <g transform="translate(0, 186)">
          <rect width="900" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
          <circle cx="25" cy="25" r="10" fill="#60a5fa" opacity="0.2" />
          <circle cx="25" cy="25" r="4" fill="#60a5fa" />
          <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#475569" font-weight="600">Depurador nativo:</text>
          <text x="880" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="end">Debugpy con breakpoints condicionales y hot reload</text>
        </g>
        
      </g>
    </g>

    <!-- Status Footer -->
    <g transform="translate(40, 500)">
      <rect width="960" height="50" rx="8" fill="#0f172a" />
      <circle cx="28" cy="25" r="5" fill="#10b981" />
      <text x="44" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">
        Prueba física realizada por Andrés en Barranquilla (Atlántico) • Licencia CC BY-NC-SA 4.0 • Sin fotos de terceros
      </text>
      <text x="940" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="end">100% Autóctona</text>
    </g>
  </g>
</svg>