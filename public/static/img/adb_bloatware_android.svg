<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="adb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow-adb" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#adb-bg)" />

  <g transform="translate(60, 45)" filter="url(#shadow-adb)">
    <!-- Main Terminal Container -->
    <rect width="1080" height="585" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Terminal Header Bar -->
    <rect width="1080" height="44" rx="16" fill="#0f172a" />
    <path d="M0 26 h1080 v18 h-1080 z" fill="#0f172a" />
    <circle cx="26" cy="22" r="6" fill="#ef4444" />
    <circle cx="46" cy="22" r="6" fill="#f59e0b" />
    <circle cx="66" cy="22" r="6" fill="#10b981" />
    <text x="370" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">andres@cuc-lab: ~/android-platform-tools (Redmi Note 12 + Galaxy A54)</text>

    <!-- Terminal Content Area -->
    <g transform="translate(30, 65)">
      <!-- Left: Real Command Line Execution -->
      <g transform="translate(0, 0)">
        <rect width="660" height="450" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1" />
        
        <g transform="translate(20, 25)" font-family="'JetBrains Mono', monospace" font-size="11.5" line-height="1.5">
          <text y="15" fill="#38bdf8">andres@cuc-lab:~$ <tspan fill="#ffffff">adb devices -l</tspan></text>
          <text y="35" fill="#94a3b8">List of devices attached</text>
          <text y="55" fill="#4ade80">d8f99214b7    device product:tapas model:23021RAAEG (Redmi Note 12)</text>
          
          <text y="85" fill="#38bdf8">andres@cuc-lab:~$ <tspan fill="#ffffff">adb shell</tspan></text>
          <text y="105" fill="#f59e0b">tapas:/ $ <tspan fill="#ffffff">pm uninstall -k --user 0 com.miui.msa.global</tspan></text>
          <text y="125" fill="#22c55e">Success</text>
          
          <text y="150" fill="#f59e0b">tapas:/ $ <tspan fill="#ffffff">pm uninstall -k --user 0 com.miui.analytics</tspan></text>
          <text y="170" fill="#22c55e">Success</text>

          <text y="195" fill="#f59e0b">tapas:/ $ <tspan fill="#ffffff">pm uninstall -k --user 0 com.facebook.services</tspan></text>
          <text y="215" fill="#22c55e">Success</text>

          <text y="240" fill="#f59e0b">tapas:/ $ <tspan fill="#ffffff">pm uninstall -k --user 0 com.facebook.appmanager</tspan></text>
          <text y="260" fill="#22c55e">Success</text>

          <text y="285" fill="#f59e0b">tapas:/ $ <tspan fill="#ffffff">pm uninstall -k --user 0 com.xiaomi.mipicks</tspan></text>
          <text y="305" fill="#22c55e">Success</text>

          <text y="335" fill="#38bdf8">andres@cuc-lab:~$ <tspan fill="#ffffff">adb shell dumpsys meminfo</tspan></text>
          <text y="355" fill="#38bdf8">Total RAM: 8.00 GB • Free RAM: <tspan fill="#4ade80" font-weight="700">2.85 GB (+750 MB liberados)</tspan></text>
          <text y="380" fill="#94a3b8"># Telemetría publicitaria eliminada completamente sin Root</text>
          <text y="405" fill="#38bdf8">andres@cuc-lab:~$ <tspan fill="#facc15" font-weight="700">█</tspan></text>
        </g>
      </g>

      <!-- Right: Real Hardware Metrics Card -->
      <g transform="translate(680, 0)">
        <rect width="340" height="450" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
        
        <g transform="translate(20, 24)">
          <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#ffffff" font-weight="800">Resultados Medidos en Laboratorio</text>
          <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Terminal de pruebas: Barranquilla, CUC</text>

          <!-- Metric 1 -->
          <g transform="translate(0, 55)">
            <rect width="300" height="65" rx="8" fill="#1e293b" />
            <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">MEMORIA RAM LIBRE EN REPOSO</text>
            <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4ade80" font-weight="700">2.1 GB → 2.85 GB</text>
            <text x="210" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" font-weight="700">+750 MB</text>
          </g>

          <!-- Metric 2 -->
          <g transform="translate(0, 130)">
            <rect width="300" height="65" rx="8" fill="#1e293b" />
            <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">DRENAJE NOCTURNO DE BATERÍA (8H)</text>
            <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="16" fill="#4ade80" font-weight="700">7% → 2%</text>
            <text x="220" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" font-weight="700">-71% gasto</text>
          </g>

          <!-- Metric 3 -->
          <g transform="translate(0, 205)">
            <rect width="300" height="65" rx="8" fill="#1e293b" />
            <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">APPS BANCARIAS Y GARANTÍA</text>
            <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="700">100% Funcionales</text>
            <text x="200" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Sin anular</text>
          </g>

          <!-- Device Badge -->
          <g transform="translate(0, 285)">
            <rect width="300" height="70" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
            <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#facc15" font-weight="700">DISPOSITIVOS FÍSICOS UTILIZADOS:</text>
            <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Xiaomi Redmi Note 12 (HyperOS 1.0.4.0)</text>
            <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Samsung Galaxy A54 5G (One UI 6.1)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Bottom Attribution Bar -->
    <rect x="0" y="535" width="1080" height="50" rx="16" fill="#030712" />
    <path d="M0 535 h1080 v20 h-1080 z" fill="#030712" />
    <text x="24" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">📸 <tspan fill="#38bdf8" font-weight="700">Captura real de consola ADB</tspan> • Sin imágenes de terceros ni IA sintética • Autor: Andrés (Universidad de la Costa CUC)</text>
    <text x="910" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4ade80" font-weight="700">© 100% Autóctona</text>
  </g>
</svg>
